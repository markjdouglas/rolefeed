# RoleFeed employer list — the core asset of this project.
#
# Each entry is an organisation Mark would plausibly take an operations leadership role
# at. The `slug` is a CANDIDATE board token, guessed from the organisation's name.
# It has NOT been verified. Run `python discover.py` to probe each slug against the
# four public ATS endpoints and write the verified results to companies.resolved.yaml.
#
# Most guesses will be wrong. That is expected and fine — discovery is cheap, and the
# ones that miss get corrected by hand from the organisation's careers page URL.
#
# To correct one by hand: open the careers page, look at the URL. If it contains
# boards.greenhouse.io/acme then the token is `acme` and the ats is `greenhouse`.
# Same pattern for jobs.lever.co/acme, jobs.ashbyhq.com/acme, and
# jobs.smartrecruiters.com/Acme.
#
# Add `ats:` and a corrected `slug:` to pin an entry and skip probing for it.

