# RoleFeed employer list — transportation, logistics, mobility and aviation.
#
# Scope (19/09/2026): technology and operations in moving people and goods. Sector-agnostic
# within that — the transferable skill is marketplace supply, network operations and
# infrastructure programmes, not any one vertical.
#
# EXCLUDED — previous employers, not targets:
#   Uber, Gett, Glue Home, Ontruck, ParkBee, Otto Car, POSTX, Apolitical, Abercrombie & Fitch.
#
# `size` buckets, so results can be read by company type. Anything estimated under 50
# people is off the list entirely.
#   enterprise  5,000+        incumbents, groups, national operators
#   large       1,000–5,000   established operators and listed tech
#   mid         250–1,000     scaled private companies
#   scaleup     50–250
#   startup     10–50         added 21/09 — small but past the founding team
# Headcounts are approximate and drawn from general knowledge, not verified per employer.
#
# `ats` + `slug` pinned = verified, probed once. Unpinned = discover.py tries variants.
# `ats: workday` needs a `workday_url` — see add_workday.py. Most enterprise employers
# run Workday, SuccessFactors, Taleo or iCIMS, none of which the four public adapters
# reach, so expect them to stay unresolved until Workday support lands.

