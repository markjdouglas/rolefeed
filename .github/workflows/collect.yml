# Collects open roles every two hours and commits the result.
#
# The commit is the deployment trigger: Cloudflare Pages watches this repository and
# rebuilds the site whenever main changes. One push-driven mechanism carries data from
# the ATS endpoints all the way to the live page, with no webhooks to wire up.
#
# Three things here are easy to get wrong the first time:
#   1. `permissions: contents: write` — without it the commit step fails with a 403,
#      because the default token is read-only.
#   2. `concurrency` — a slow run must not overlap the next scheduled one, or two jobs
#      race to commit the same file and one loses.
#   3. The commit is conditional. Committing "no changes" every run would produce twelve
#      empty commits a day and a pointless Pages rebuild each time.

name: Collect roles

on:
  schedule:
    # Every two hours at 37 minutes past, UTC. Deliberately NOT on the hour: `0 * * * *`
    # is the most common cron expression on GitHub, so the shared scheduler queue is
    # deepest then. Measured over 14 runs, an on-the-hour schedule fired 11-17 minutes
    # late, every time. An unpopular minute should shorten that. GitHub still guarantees
    # nothing about scheduled start times, which is why the UI says "due", never "in".
    - cron: "37 */2 * * *"
  # Run on demand from the Actions tab. Free, and it means no refresh button and no
  # token-holding proxy.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # Pinned, not `ubuntu-latest`. GitHub annotated this very run three times to say
    # that label migrates to Ubuntu 26 from 19 October 2026. An unattended job that
    # nobody watches should not have its operating system changed underneath it on a
    # date chosen by someone else; pinning turns a surprise into a scheduled upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Collect roles
        run: python fetch.py --json
        env:
          PYTHONUNBUFFERED: "1"

      # The collection has already succeeded by the time this step runs, so the only
      # thing left that can throw it away is the push. On 7 October run 196 did exactly
      # that: every step passed, 967 roles were fetched, and the push failed, so a good
      # collection was discarded and the feed went four hours stale for want of one
      # retry.
      #
      # jobs.json is generated and has exactly one writer, so it never needs merging --
      # the newest generation is always the right answer. That makes the recovery
      # last-write-wins rather than a rebase: keep the file aside, reset onto whatever
      # the remote now has, put the file back, commit again. No merge semantics, and no
      # way to end up stopped half way through a rebase with a conflict in a file that
      # nobody edits by hand.
      - name: Commit the feed if it changed
        run: |
          git config user.name "rolefeed-bot"
          git config user.email "markjdouglas@users.noreply.github.com"

          if git diff --quiet --exit-code site/data/jobs.json; then
            echo "No change in the feed. Nothing to commit."
            exit 0
          fi

          NEW=$(python -c "import json;print(json.load(open('site/data/jobs.json'))['new_this_run'])")
          TOTAL=$(python -c "import json;print(json.load(open('site/data/jobs.json'))['matching_roles'])")
          MSG="Feed update: ${TOTAL} roles, ${NEW} new"

          cp site/data/jobs.json "${RUNNER_TEMP}/jobs.json"
          git add site/data/jobs.json
          git commit -m "${MSG}"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed."
            if [ "${attempt}" -eq 3 ]; then break; fi

            sleep $(( attempt * 10 ))
            git fetch origin main
            git reset --hard origin/main
            cp "${RUNNER_TEMP}/jobs.json" site/data/jobs.json

            # If another run got there first with the same data there is nothing left to
            # do, and committing an empty change would fail the step for no reason.
            if git diff --quiet --exit-code site/data/jobs.json; then
              echo "The remote already carries this feed. Nothing left to push."
              exit 0
            fi
            git add site/data/jobs.json
            git commit -m "${MSG}"
          done

          echo "::error::Collection succeeded but the feed could not be pushed after three attempts."
          exit 1

      - name: Summarise the run
        if: always()
        run: |
          if [ -f site/data/jobs.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          feed = json.load(open("site/data/jobs.json"))
          print("## Collection summary\n")
          print(f"- Matching roles: **{feed['matching_roles']}**")
          print(f"- New this run: **{feed['new_this_run']}**")
          print(f"- New in last 48h: **{feed['new_last_48h']}**")
          print(f"- Closed this run: {feed['closed_this_run']}")
          print(f"- Employers queried: {feed['employers_queried']}")
          print(f"- Employers failed: {feed['employers_failed']}")
          if feed.get("failures"):
              print("\n<details><summary>Failures</summary>\n")
              for failure in feed["failures"]:
                  print(f"- {failure}")
              print("\n</details>")
          PY
          else
            echo "No feed produced — the collector failed." >> "$GITHUB_STEP_SUMMARY"
          fi
