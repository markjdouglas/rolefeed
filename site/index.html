<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page paint under the notch and home indicator; the
     safe-area insets below then keep content clear of them. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Tints Safari's toolbars to match the page instead of leaving a white band. -->
<meta name="theme-color" content="#100d22">
<meta name="color-scheme" content="dark">
<!-- URL-only access is obscurity, not security, and the likeliest way it leaks is
     a search engine. This does not stop anyone with the link; it stops the link
     becoming public by accident. Cloudflare Access is the actual control. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

Crect x='9' y='16' width='4' height='1' fill='%23d9d0bb'/%3E%3Crect x='13' y='16' width='7' height='1' fill='%23f4eddf'/%3E%3Crect x='20' y='16' width='1' height='1' fill='%232a2250'/%3E%3Crect x='2' y='17' width='1' height='1' fill='%232a2250'/%3E%3Crect x='3' y='17' width='1' height='1' fill='%23d9d0bb'/%3E%3Crect x='4' y='17' width='4' height='1' fill='%23f4eddf'/%3E%3Crect x='8' y='17' width='6' height='1' fill='%23d9d0bb'/%3E%3Crect x='14' y='17' width='6' height='1' fill='%23f4eddf'/%3E%3Crect x='20' y='17' width='1' height='1' fill='%232a2250'/%3E%3Crect x='2' y='18' width='1' height='1' fill='%232a2250'/%3E%3Crect x='3' y='18' width='2' height='1' fill='%23d9d0bb'/%3E%3Crect x='5' y='18' width='3' height='1' fill='%23f4eddf'/%3E%3Crect x='8' y='18' width='5' height='1' fill='%23d9d0bb'/%3E%3Crect x='13' y='18' width='6' height='1' fill='%23f4eddf'/%3E%3Crect x='19' y='18' width='1' height='1' fill='%232a2250'/%3E%3Crect x='3' y='19' width='1' height='1' fill='%232a2250'/%3E%3Crect x='4' y='19' width='2' height='1' fill='%23d9d0bb'/%3E%3Crect x='6' y='19' width='3' height='1' fill='%23f4eddf'/%3E%3Crect x='9' y='19' width='3' height='1' fill='%23d9d0bb'/%3E%3Crect x='12' y='19' width='6' height='1' fill='%23f4eddf'/%3E%3Crect x='18' y='19' width='1' height='1' fill='%232a2250'/%3E%3Crect x='4' y='20' width='2' height='1' fill='%231a1533'/%3E%3Crect x='6' y='20' width='2' height='1' fill='%23d9d0bb'/%3E%3Crect x='8' y='20' width='8' height='1' fill='%23f4eddf'/%3E%3Crect x='16' y='20' width='2' height='1' fill='%231a1533'/%3E%3Crect x='6' y='21' width='3' height='1' fill='%231a1533'/%3E%3Crect x='9' y='21' width='5' height='1' fill='%23f4eddf'/%3E%3Crect x='14' y='21' width='2' height='1' fill='%231a1533'/%3E%3Crect x='9' y='22' width='1' height='1' fill='%232a2250'/%3E%3Crect x='10' y='22' width='2' height='1' fill='%23f2a63a'/%3E%3Crect x='12' y='22' width='1' height='1' fill='%232a2250'/%3E%3Crect x='13' y='22' width='2' height='1' fill='%23f2a63a'/%3E%3Crect x='15' y='22' width='1' height='1' fill='%232a2250'/%3E%3Crect x='8' y='23' width='1' height='1' fill='%232a2250'/%3E%3Crect x='9' y='23' width='3' height='1' fill='%23f2a63a'/%3E%3Crect x='12' y='23' width='1' height='1' fill='%232a2250'/%3E%3Crect x='13' y='23' width='3' height='1' fill='%23f2a63a'/%3E%3Crect x='16' y='23' width='1' height='1' fill='%232a2250'/%3E%3Crect x='7' y='24' width='1' height='1' fill='%232a2250'/%3E%3Crect x='8' y='24' width='1' height='1' fill='%23f2a63a'/%3E%3Crect x='9' y='24' width='2' height='1' fill='%23c17d15'/%3E%3Crect x='11' y='24' width='1' height='1' fill='%23f2a63a'/%3E%3Crect x='12' y='24' width='1' height='1' fill='%232a2250'/%3E%3Crect x='13' y='24' width='1' height='1' fill='%23f2a63a'/%3E%3Crect x='14' y='24' width='2' height='1' fill='%23c17d15'/%3E%3Crect x='16' y='24' width='1' height='1' fill='%23f2a63a'/%3E%3Crect x='17' y='24' width='1' height='1' fill='%232a2250'/%3E%3Crect x='8' y='25' width='4' height='1' fill='%232a2250'/%3E%3Crect x='13' y='25' width='4' height='1' fill='%232a2250'/%3E%3C/svg%3E">
<style>
  /* ---------------------------------------------------------------------
     Design tokens. Every colour in the page comes from here, so retheming
     means editing this block and nothing else.
     --------------------------------------------------------------------- */
  :root {
    /* Base. Indigo, unchanged — Superhuman's own base is #1b1938, so this is a
       well-trodden value for a dark canvas. */
    --bg:            #100d22;   /* deeper floor, so raised things read as raised */
    --surface:       #191637;   /* cards and the bar: RAISED */
    --sunken:        #0a0818;   /* data readouts: RECESSED. The grammar is that
                                   controls stand up and numbers sink in. */
    --surface-2:     #231f49;   /* control faces */

    /* Separation is CREAM at low alpha, not purple. This single change is what stops
       the page reading as "a purple app": structure becomes neutral, so the accent
       has something to stand against. */
    --border:        rgba(244, 237, 223, 0.17);
    --border-bright: rgba(244, 237, 223, 0.36);
    --rule:          rgba(244, 237, 223, 0.11);

    /* Purple now does exactly one job: mark what you should act on or look at.
       Primary button, focus ring, matched chip. Nowhere else. */
    --purple:        #8b6cff;
    --purple-bright: #a98bff;

    --gold:          #e9c46a;   /* deco rules and the plinth */
    --cream:         #f4eddf;
    --cream-dim:     #cfc6b8;
    --muted:         #9d9483;   /* warm grey, was lavender — the other purple leak */

    --amber:         #ffb84d;
    --hot:           #ff6a3d;   /* posted in the last 24h — hotter than amber */
    --shadow:        #060412;   /* hard offset shadow — no blur, ever */
    --bevel:         rgba(244, 237, 223, 0.09);  /* top-left inner highlight */
    /* The floor tile. Its own token, not --bevel: the bevel sits on a solid card
       edge where 9% alpha reads as a highlight, but the same value spread across
       the whole page reads as noise behind text. Halved, and on a coarser grid. */
    --tile:          rgba(244, 237, 223, 0.045);
    --amber-dim:     #6b4a17;
    --green:         #5ad1a0;
    /* A fourth accent hue, so the numbers stop being one undifferentiated block.
       One hue, one meaning: teal is volume and coverage, purple is what to act on,
       hot is 24h, amber is 48h, muted is reference. */
    --teal:          #56cfc2;
    --teal-dim:      #1d4f4c;
    --red:           #ff7a7a;

    /* Pixel art means no rounding. Everything is square. */
    --radius:   0px;
    --radius-s: 0px;
    --gutter: 16px;
    /* One height, one padding, one type size for every control on the page. The nav
       tabs were 36px with a 2px border and a 3px shadow, the selects 38px with a 1px
       border and no shadow, the toggles 34px with a 2px shadow — three heights and
       three treatments sitting on the same row. A control is a control. */
    --control-h: 34px;
    --control-px: 12px;
    --control-fs: 12.5px;
    --max:   1180px;
    --brand-w: 220px;   /* the fixed brand slot, shared by all four pages */
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;   /* stop Safari inflating text on rotate */
    background: var(--bg);            /* colours the overscroll rubber-band area */
    /* The floor tile lives HERE, not on body, and the reason is painting order.
       CSS paints a stacking context in a fixed sequence: the context element's own
       background first, then negative z-index descendants, then the backgrounds of
       in-flow non-positioned boxes. body is in-flow and unpositioned, so its
       background paints AFTER a z-index:-1 pseudo-element. Putting the tile on body
       and the solid panel in body::before therefore drew the tile straight back over
       the panel. On html, the tile paints first and the panel covers it. */
    background-image:
      linear-gradient(45deg, var(--tile) 25%, transparent 25%, transparent 75%, var(--tile) 75%),
      linear-gradient(45deg, var(--tile) 25%, transparent 25%, transparent 75%, var(--tile) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    background-attachment: fixed;     /* the floor does not scroll with the content */
  }

  body {
    margin: 0;
    /* Deliberately transparent: the tile is on html and the solid content column is
       painted by body::before below. A background here would hide both. */
    background: transparent;
    /* iOS momentum scrolling, and no grey flash on tap. */
    -webkit-overflow-scrolling: touch;
    -webkit-tap-highlight-color: transparent;
    /* Keeps content out from under the notch and the home indicator. */
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    color: var(--cream);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "cv02", "cv03", "cv04", "tnum";
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
  /* --------------------------------------------------------------------------
     Page navigation. Previously the only route off this page was the version
     number, which read as a label rather than a control — nobody clicks a
     version number. These are deliberately obvious: a raised box, a gold
     caret, a border that brightens on hover, and a press state that pushes the
     tab into its own shadow. Affordance beats discoverability.
     -------------------------------------------------------------------------- */

  /* --------------------------------------------------------------------------
     Top bar. This is the first element on every page, above everything else,
     for one reason: it is the only way the navigation can sit in an identical
     position on all three pages. Previously it lived inside each page's header,
     below content of different heights and inside columns of different widths,
     so it moved down and left when you changed page. Navigation that moves is
     navigation you have to re-find.
     -------------------------------------------------------------------------- */

  /* The reason line. Deliberately quiet — it is there to be consulted, not read. */
  .why {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--rule);
    font-size: 11px; letter-spacing: .04em; color: var(--muted);
  }
  .why .sep { opacity: .5; }

  .topbar {
    background: var(--surface);
    border-top: 3px solid var(--gold);
    border-bottom: 1px solid var(--border);
  }
  .bar-wrap {
    max-width: var(--max); margin: 0 auto; padding: 7px var(--gutter);
    min-height: 60px;
    /* nowrap, deliberately. With wrapping on, the ALPHA badge and version were pushed
       onto a line of their own the moment brand + tagline + nav filled the row, which
       is what turned a 54px bar into a 190px one with an empty band in it. The tagline
       is the flexible element and truncates instead. */
    display: flex; align-items: center; gap: 14px; flex-wrap: nowrap;
  }
  .nav { margin-left: auto; flex: 0 0 auto; }
  .bar-wrap .tagline { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 860px) {
    .bar-wrap { flex-wrap: wrap; }
    .nav { margin-left: 0; }
  }
  /* Fixed width and right-aligned, so the badge and the version read as one balanced
     block against the tabs rather than two differently-sized scraps. */
  .bar-wrap .build {
    margin-left: 14px; flex: 0 0 116px;
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  }
  .alpha, .ver {
    display: inline-flex; align-items: center; justify-content: center;
    height: 22px; box-sizing: border-box;
  }
  .alpha { padding: 0 8px; box-shadow: 2px 2px 0 var(--shadow); }
  .ver { min-width: 46px; border-bottom: 0; color: var(--cream-dim); }

  .nav { display: flex; gap: 8px; flex-wrap: nowrap; margin: 0; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: var(--control-h); padding: 0 var(--control-px);
    background: var(--surface-2); color: var(--cream-dim);
    border: 1px solid var(--border-bright);
    box-shadow: 2px 2px 0 var(--shadow);
    font-size: 11px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; text-decoration: none;
    touch-action: manipulation; cursor: pointer;
  }
  .tab::before { content: "\25B8"; color: var(--gold); font-size: 9px; }
  .tab:hover { color: var(--cream); border-color: var(--cream-dim); }
  .tab:active { transform: translate(2px, 2px); box-shadow: none; }
  .tab.on { background: var(--cream); color: #292827; border-color: var(--cream); }
  .tab.on::before { color: #8a6a1f; }
  .tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }


  /* Habbo floor tiling belongs on the floor, not under the prose. This fixed panel
     paints solid --bg across the content column, so the checkerboard survives only in
     the gutters either side and reads as a frame rather than an overlay. Below --max
     there are no gutters, so the texture disappears entirely — which is the right
     answer on a phone, where it was pure noise. */
  body::before {
    content: "";
    position: fixed;
    inset: 0 auto 0 50%;
    transform: translateX(-50%);
    width: min(100%, var(--max));
    background: var(--bg);
    z-index: -1;
    pointer-events: none;
  }

  a { color: var(--purple-bright); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------------------------------------------------------------------
     Header
     --------------------------------------------------------------------- */
  /* The gold rule and the brand moved to the top bar, so this element now carries
     only the numbers and the freshness strip. One band instead of three. */
  header { background: var(--bg); padding: 10px 0 0; }

  /* --px is the size of one art pixel, shared by both marks so their grids align. */
  /* Was 2.6, which made a 224px wordmark and a 70px goose, stacked above the nav in a
     band of its own. At 1.6 the whole lockup fits on one 54px row beside the nav. */
  /* The brand slot is a FIXED width on every page. That is what stops the tabs
     moving: whatever sits in the slot — the animated lockup here, the same artwork as
     a static file elsewhere — the nav always begins at the same x. A navigation that
     shifts when you change page makes you re-find it every time. */
  .brand {
    --px: 1.78;
    display: flex;
    align-items: center;
    gap: calc(var(--px) * 5px);
    flex: 0 0 var(--brand-w);
    text-decoration: none;
  }
  .brand:hover { text-decoration: none; }

  /* image-rendering: pixelated stops the browser smoothing the blocks, which is the
     whole point of drawing them as blocks. */
  .goose svg, .wordmark svg { image-rendering: pixelated; display: block; }

  /* Frame selection. Only the group matching data-frame is drawn; the others are
     display:none, so there is nothing to composite and no cost to carrying them. */
  .goose .gf { display: none; }
  .goose[data-frame="idle"]   .gf-idle,
  .goose[data-frame="blink"]  .gf-blink,
  .goose[data-frame="peck"]   .gf-peck,
  .goose[data-frame="flap"]   .gf-flap,
  .goose[data-frame="lookup"] .gf-lookup,
  .goose[data-frame="stamp"]  .gf-stamp { display: block; }

  /* The waddle moves her by whole art pixels. steps(1) on each segment keeps the
     positions discrete — a smooth transform would land her on half a pixel and the
     browser would resample the blocks into mush. */
  .goose.waddle svg {
    animation: waddle 0.72s steps(1, end) 1;
  }
  @keyframes waddle {
    0%,  100% { transform: translateX(0); }
    20%       { transform: translateX(calc(var(--px) * 1px)); }
    40%       { transform: translateX(0); }
    60%       { transform: translateX(calc(var(--px) * -1px)); }
    80%       { transform: translateX(0); }
  }

  /* Someone who has asked their OS for less motion gets a goose that simply stands
     there. The mascot is decoration; it is never worth overriding that preference. */
  @media (prefers-reduced-motion: reduce) {
    .goose.waddle svg { animation: none; }
    .meter i.edge { animation: none; }
  }
  .goose svg    { width: calc(var(--px) * 30px); height: calc(var(--px) * 27px); }
  .wordmark     { margin: 0; line-height: 0; }
  .wordmark svg { width: calc(var(--px) * 86px); height: calc(var(--px) * 26px); }

  .build {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    align-self: flex-start;
  }
  /* Says plainly what this is. An alpha that does not admit it is just a broken
     product. */
  .alpha {
    background: var(--hot);
    color: #1a1533;
    font-size: 10px;
    font-weight: 750;
    letter-spacing: 0.14em;
    padding: 3px 7px;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .ver {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    border-bottom: 1px dotted var(--border-bright);
  }
  .ver:hover { color: var(--cream); text-decoration: none; }

  .tagline {
    display: none;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.4;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-left: 1px solid var(--rule);
    padding-left: 13px;
  }
  @media (min-width: 1240px) { .tagline { display: block; } }

  /* Stat row */
  /* Nine tiles at 25px type and 4px shadows cost about 130 vertical pixels and pushed
     the first role below the fold on a 13-inch screen. The numbers are reference, not
     hero content, so they become one 34px strip: values still tabular and legible,
     labels beside them rather than beneath. */
  .stats {
    display: flex;
    flex-wrap: wrap;
    margin: 8px 0 0;
    /* Recessed rather than raised, and on its own darker tone. Previously it was
       --surface on --bg, two values four points apart with a 13% border: there was
       nothing to tell you where the strip began. */
    background: var(--sunken);
    border: 1px solid var(--border);
    box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.5);
  }
  .stat {
    flex: 1 1 auto;
    min-width: 96px;
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 7px 11px;
    border-right: 1px solid var(--rule);
  }
  .stat:last-child { border-right: 0; }
  .stat .n {
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat.minor .n { font-size: 13.5px; color: var(--cream-dim); font-weight: 600; }
  .stat .l {
    white-space: nowrap;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  /* State by the value's colour, not by a border: nine coloured borders in a strip
     reads as noise, and the number is what you are looking at anyway. */
  .stat.accent .n  { color: var(--amber); }
  .stat.hotstat .n { color: var(--hot); }
  .stat.prime .n   { color: var(--purple-bright); font-size: 16px; }
  .stat.pool .n    { color: var(--teal); }
  .stat.prime      { background: rgba(139, 108, 255, 0.07); }
  .stat.pool       { background: rgba(86, 207, 194, 0.05); }

  /* Freshness strip */
  .freshness { margin: 9px 0 0; padding-bottom: 10px; }
  .freshness-line {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--cream-dim);
  }
  .pulse {
    width: 8px; height: 8px;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(90, 209, 160, 0.16);
    flex: none;
  }
  .pulse.warn { background: var(--amber); box-shadow: 0 0 0 3px rgba(255,184,77,0.16); }
  .pulse.bad  { background: var(--red);   box-shadow: 0 0 0 3px rgba(255,122,122,0.16); }

  /* A segmented meter rather than a smooth bar: discrete blocks suit the pixel
     theme, and a block either is or is not lit, which reads faster than a bar edge. */
  .meter { display: flex; gap: 2px; margin-top: 7px; }
  .meter i {
    flex: 1;
    height: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    transition: background 0.25s, border-color 0.25s;
  }
  .meter i.lit    { background: var(--gold);  border-color: var(--gold); }
  /* The leading block pulses, so the page reads as live rather than as a stale render. */
  .meter i.edge   { background: var(--cream); border-color: var(--cream); animation: blip 1s steps(2) infinite; }
  .meter.overdue i.lit  { background: var(--amber); border-color: var(--amber); }
  .meter.overdue i.edge { background: var(--amber); border-color: var(--amber); }
  @keyframes blip { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.35; } }

  .clock {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    color: var(--cream);
    font-weight: 620;
    letter-spacing: 0.02em;
  }
  .clock.overdue { color: var(--amber); }

  .sep { color: var(--border-bright); }

  /* ---------------------------------------------------------------------
     Controls
     --------------------------------------------------------------------- */
  .controls {
    position: sticky;
    top: 0;
    z-index: 20;
    /* Was rgba(20,16,43,…) — the old --bg, left behind when the palette moved, so
       this band was tinted to a colour no longer used anywhere. Now the surface tone,
       which also separates it from the header band above it. */
    background: rgba(25, 22, 55, 0.97);
    -webkit-backdrop-filter: blur(10px);   /* Safari still needs the prefix */
    backdrop-filter: blur(10px);
    /* The single strong boundary. Previously the eye crossed a gold rule, a header
       border, a stats grid and a 1px control border before reaching a role — four weak
       separators read as drift, one firm one reads as a boundary. */
    border-bottom: 2px solid var(--border-bright);
    padding: 9px 0;
  }
  .control-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .control-row.extra { margin-top: 8px; }

  /* Above the mobile breakpoint the two control rows flatten into one flex line, so
     search, selects, sort and toggles share a row and wrap only when they must.
     `display: contents` removes the wrappers from layout without touching the markup
     the mobile drawer depends on. */
  @media (min-width: 641px) {
    .controls .wrap { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .control-row { display: contents; }
    .control-row.extra { margin-top: 0; }
    /* Eleven controls on one line at 1180px. Everything flexes and nothing has a
       fixed width, so they share the row evenly and wrap as a group rather than
       leaving one orphan below. */
    #q { flex: 1 1 140px; min-width: 120px; }
    .control-row select { flex: 1 1 96px; min-width: 0; }
    .control-row .toggle { flex: 0 1 auto; }
    #countNote { flex: 1 1 100%; margin: 7px 0 0; }
  }

  /* The Filters button exists only on touch layouts; on a wide screen every control
     is already visible and a disclosure would just be an extra click. */
  .filters-btn { display: none; }
  .filters-btn .caret { font-size: 9px; transition: transform 0.18s; }
  .controls.open .filters-btn .caret { transform: rotate(180deg); }
  .filters-btn .badge {
    background: var(--gold);
    color: #1a1533;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    min-width: 18px;
    text-align: center;
  }

  input[type="search"], select {
    background: var(--surface-2);
    color: var(--cream);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 0 var(--control-px);
    font: inherit;
    font-size: var(--control-fs);
    box-shadow: 2px 2px 0 var(--shadow);
    /* Safari renders search inputs and selects with its own chrome unless told not to. */
    -webkit-appearance: none;
    appearance: none;
    min-height: var(--control-h);
  }
  input[type="search"] { flex: 1 1 220px; min-width: 0; }
  input[type="search"]::placeholder { color: var(--muted); }
  /* Removes Safari's native magnifier and clear button, which ignore our styling. */
  input[type="search"]::-webkit-search-decoration,
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

  /* Mobile Safari zooms the entire page when a focused field's text is under 16px,
     leaving the user pinching back out. Raising the font on touch devices is the fix;
     it is applied by pointer type rather than width so a small laptop keeps 13px. */
  @media (pointer: coarse) {
    input[type="search"], select { font-size: 16px; min-height: 44px; }
  }
  input[type="search"]:focus, select:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(139, 108, 255, 0.16);
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 0 var(--control-px);
    font-size: var(--control-fs);
    color: var(--cream-dim);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    white-space: nowrap;
    touch-action: manipulation;
    min-height: var(--control-h);
  }
  .toggle { box-shadow: 2px 2px 0 var(--shadow); }
  .toggle:hover { border-color: var(--border-bright); }
  .toggle:active { transform: translate(2px, 2px); box-shadow: none; }
  .toggle.on {
    background: rgba(244, 237, 223, 0.10);
    border-color: var(--border-bright);
    color: var(--cream);
  }
  .toggle.on.amber {
    background: rgba(255, 184, 77, 0.13);
    border-color: var(--amber);
  }
  .toggle input { display: none; }
  .toggle .tick { width: 13px; text-align: center; opacity: 0.45; }
  .toggle.on .tick { opacity: 1; color: var(--gold); }
  .toggle.on.amber .tick { color: var(--amber); }

  .toggle .flame { font-size: 12px; filter: grayscale(1) opacity(0.5); }
  .toggle.hot.on {
    background: rgba(255, 106, 61, 0.16);
    border-color: var(--hot);
    color: var(--cream);
  }
  .toggle.hot.on .flame { filter: none; }

  .chip.hot {
    background: rgba(255, 106, 61, 0.18);
    border-color: var(--hot);
    color: var(--hot);
    font-weight: 650;
  }
  .role.is-hot { border-left-color: var(--hot); }

  .count-note { font-size: 12px; color: var(--muted); margin-top: 9px; }
  .count-note button {
    background: none; border: none; padding: 0;
    color: var(--cream-dim); font: inherit; cursor: pointer;
    text-decoration: underline;
  }

  /* ---------------------------------------------------------------------
     Results
     --------------------------------------------------------------------- */
  main { padding: 22px 0 80px; }

  .bucket { margin-bottom: 30px; }
  .bucket-head {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    background: none; border: none; padding: 7px 0 8px;
    color: var(--cream); font: inherit; cursor: pointer;
    /* Was a 2px rule at 11% cream, which is less contrast than the gap around it, so
       groups ran together. A brighter rule plus a gold plinth under it reads as a
       divider between sections rather than as decoration inside one. */
    border-bottom: 2px solid var(--border-bright);
    box-shadow: 0 2px 0 var(--amber-dim);
    text-align: left;
  }
  .bucket-head h2 {
    margin: 0; font-size: 13px; font-weight: 620;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .bucket-head .range { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .bucket-head .n {
    margin-left: auto;
    background: var(--surface-2);
    border: 1px solid var(--border-bright);
    border-radius: 0;
    padding: 2px 9px;
    font-size: 12px;
    color: var(--cream-dim);
    font-variant-numeric: tabular-nums;
  }
  .bucket-head .chev { color: var(--muted); font-size: 11px; transition: transform 0.15s; }
  /* Three stepped blocks, largest last — a ziggurat rotated onto its side. */
  .bucket-head .blocks {
    flex: none; width: 13px; height: 13px;
    background:
      linear-gradient(var(--gold), var(--gold)) 0 8px / 3px 3px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 5px 4px / 3px 5px no-repeat,
      linear-gradient(var(--gold), var(--gold)) 10px 0 / 3px 9px no-repeat;
    opacity: 0.75;
  }
  .bucket.collapsed .chev { transform: rotate(-90deg); }
  .bucket.collapsed .roles { display: none; }

  .roles { display: grid; gap: 8px; padding-top: 12px; }

  .role {
    background: var(--surface);
    border: 2px solid var(--border);
    border-left: 4px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow), inset 1px 1px 0 var(--bevel);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 14px;
    align-items: start;
    transition: border-color 0.12s, background 0.12s;
  }
  /* Hover lifts the card one pixel toward the light and grows the shadow. Discrete
     steps, no transition on the shadow — an animated shadow looks like CSS, a jump
     looks like a sprite. */
  .role:hover {
    border-color: var(--border-bright);
    background: #262052;
    transform: translate(-1px, -1px);
    box-shadow: 6px 6px 0 var(--shadow), inset 1px 1px 0 var(--bevel);
  }
  .role.is-new { border-left-color: var(--amber); }
  .role.priority-mark { border-left-color: var(--purple); }
  .role.shortlisted { border-left-color: var(--green); }
  .role.dismissed { opacity: 0.42; }
  .role.secondary .title { color: var(--cream-dim); font-weight: 500; }

  .role .title {
    grid-column: 1;
    font-size: 15px;
    font-weight: 580;
    letter-spacing: -0.005em;
  }
  .role .meta {
    grid-column: 1;
    font-size: 12.5px;
    color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .role .company { color: var(--cream-dim); font-weight: 500; }

  .chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
    border-radius: 0;
    padding: 0 7px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .chip.new { background: rgba(255,184,77,0.14); border-color: var(--amber-dim); color: var(--amber); font-weight: 600; }
  .chip.tier { border-color: var(--border-bright); color: var(--cream-dim); }
  .chip.match { background: rgba(139,108,255,0.14); border-color: var(--purple); color: var(--purple-bright); }

  .role .actions {
    grid-column: 2; grid-row: 1 / span 2;
    display: flex; gap: 5px; align-items: center;
  }
  .btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    box-shadow: 2px 2px 0 var(--shadow);
    color: var(--cream-dim);
    border-radius: var(--radius-s);
    padding: 5px 10px;
    font: inherit; font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-bright); color: var(--cream); }
  /* Pressing pushes the button into its own shadow. The oldest tactile trick there
     is, and it still works better than any easing curve. */
  .btn:active { transform: translate(2px, 2px); box-shadow: none; }
  .btn.star.on { background: rgba(90,209,160,0.14); border-color: var(--green); color: var(--green); }
  /* Cream, not purple. Eight purple buttons down a page is not "a single gesture of
     colour" — it is the same mistake relocated. Superhuman uses warm cream for
     buttons for exactly this reason: the primary action reads as primary because it
     is the lightest thing on a dark canvas, and the accent stays rare. */
  .btn.open {
    background: var(--cream);
    border-color: var(--cream);
    color: #1a1533;
    font-weight: 650;
  }
  .btn.open:hover {
    background: #fffdf7; border-color: #fffdf7; text-decoration: none;
  }

  .empty, .loading {
    text-align: center;
    padding: 56px 20px;
    color: var(--muted);
  }
  .empty strong { color: var(--cream); display: block; margin-bottom: 6px; font-size: 16px; }

  .banner {
    border-radius: var(--radius);
    padding: 11px 14px;
    margin-bottom: 18px;
    font-size: 13px;
    border: 1px solid var(--amber-dim);
    background: rgba(255,184,77,0.08);
    color: var(--cream-dim);
  }
  .banner.bad { border-color: #6b2323; background: rgba(255,122,122,0.08); }
  .banner strong { color: var(--amber); }
  .banner.bad strong { color: var(--red); }

  footer {
    border-top: 1px solid var(--border);
    padding: 16px 0 40px;
    color: var(--muted);
    font-size: 12px;
  }

  @media (max-width: 640px) {
    .freshness-line .sep { display: none; }
    .masthead { --px: 2; gap: 10px; }
    .tagline { flex-basis: 100%; border-left: 0; padding-left: 0; margin-top: 4px; }
    /* Bigger tap targets and a roomier grid on a phone. */
    .btn { min-height: 40px; padding: 9px 13px; }
    .toggle { min-height: 40px; }
    .role { padding: 13px; }
    main { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    footer { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
    /* The whole filter set wrapped to four rows and, being sticky, occupied over half
       the viewport while content scrolled underneath. The fix is a compact sticky bar:
       search plus a disclosure. The panel is then a deliberate action, not permanent
       furniture, and the sticky element is one row tall. */
    .controls { padding: 8px 0; }
    .control-row.primary { gap: 8px; }
    .control-row.extra {
      display: none;
      margin-top: 8px;
      /* Long enough on a small screen to need its own scroll rather than pushing the
         page down. dvh, not vh, because Safari's toolbars change the viewport height
         as you scroll and vh would jump. */
      max-height: 52dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .controls.open .control-row.extra { display: flex; }

    .filters-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: none;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--cream);
      font: inherit;
      font-size: 14px;
      padding: 0 13px;
      min-height: 44px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .controls.open .filters-btn { border-color: var(--border-bright); }
    /* Selects and toggles fill the panel two-up rather than wrapping raggedly. */
    .control-row.extra select { flex: 1 1 calc(50% - 4px); }
    .control-row.extra .toggle { flex: 1 1 calc(50% - 4px); justify-content: center; }
    .count-note { margin-top: 6px; font-size: 11.5px; white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
    .note-long { display: none; }
    /* Four tiles, not eight. The other four are reference figures, and on a phone
       they push the actual roles three screens down. They stay in the footer line. */
    .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat.minor { display: none; }
    .stat { padding: 9px 11px; }
    .stat .n { font-size: 22px; }
    .role { grid-template-columns: 1fr; }
    .role .actions { grid-column: 1; grid-row: auto; padding-top: 6px; }
    .stat .n { font-size: 21px; }
    h1 { font-size: 19px; }
  }
</style>

      <select id="tier">
        <option value="">All seniority</option>
        <option value="exec">Exec (COO, VP, GM, MD)</option>
        <option value="director">Director &amp; Head of</option>
        <option value="mid">Mid-senior (Manager, Lead)</option>
      </select>
      <select id="sort">
        <option value="new">Newest first</option>
        <option value="company">By employer</option>
        <option value="title">By title</option>
      </select>
      <label class="toggle on" id="t-priority"><span class="tick">&#10003;</span>Matched</label>
      <label class="toggle hot" id="t-hot"><span class="flame">&#128293;</span>Hot 24h</label>
      <label class="toggle amber" id="t-recent"><span class="tick">&#10003;</span>New 48h</label>
      <label class="toggle" id="t-star"><span class="tick">&#10003;</span>Starred</label>
      <label class="toggle" id="t-dismissed"><span class="tick">&#10003;</span>Hidden</label>
    </div>
    <div class="count-note" id="countNote"></div>
  </div>
</div>

<main class="wrap">
  <div id="banner"></div>
  <div class="loading" id="results">Loading the feed&hellip;</div>
</main>

<footer class="wrap">
  <span id="footNote"></span>
</footer>

<script>
"use strict";

/* ---------------------------------------------------------------------------
   State. `feed` is the published JSON; `local` is per-viewer annotation.

   Shortlist and dismiss live in localStorage for now. That means one browser on
   one machine: it will not follow you to your phone, and clearing site data
   loses it. Moving this to Cloudflare KV via a Pages Function is the planned
   next step, and only this object needs to change when it happens.
   --------------------------------------------------------------------------- */
// Bumped by hand with each change set, and mirrored in changelog.html. Three-part:
// major.minor.patch. Still 0.x, which is the honest signal — the data contract is not
// stable and the filters are still being tuned.
const RF_VERSION = "0.4.3";

const LS_KEY = "rolefeed.annotations.v1";
const HOUR = 3600 * 1000;

let feed = null;
const local = load();

const ui = {
  q: "", size: "", sector: "", company: "", sort: "new",
  priority: true, tier: "", hot: false, recent: false, starred: false, showDismissed: false,
};

// Hot means first seen in the last 24 hours. The window matters: the application-
// timing thesis is that the first 48 hours carry most of the odds, so 24 marks the
// half of that window still fully open.
const HOT_HOURS = 24;

/* Sector slugs are how the employer list stores them; these are how they should read. */
const SECTOR_LABELS = {
  ridehail: "Ride-hail", micromobility: "Micromobility", lastmile: "Last mile",
  freight: "Freight", fulfilment: "Fulfilment", charging: "EV charging",
  fleet: "Fleet & telematics", publictransport: "Public transport",
  aviation: "Aviation & space", autonomy: "Autonomy",
};
const sectorLabel = s => SECTOR_LABELS[s] || s || "";

/* Size buckets, largest first. This list is the ONLY thing that decides which roles
   get rendered, so a size present in the data but missing here disappears silently —
   which is exactly what happened when the startup bucket was added to the collector
   and not to this array. The "unknown" catch-all at the end is the guard against
   that recurring: any size not matched above falls into it and stays visible. */
const BUCKETS = [
  ["enterprise", "Enterprise", "5,000+"],
  ["large",      "Large",      "1,000–5,000"],
  ["mid",        "Mid",        "250–1,000"],
  ["scaleup",    "Scaleup",    "50–250"],
  ["startup",    "Startup",    "10–50"],
  ["unknown",    "Unclassified", ""],
];
const BUCKET_KEYS = new Set(BUCKETS.map(b => b[0]));

function load() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
  catch (e) { return {}; }   // private mode, blocked storage, corrupt value
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(local)); }
  catch (e) { /* nothing we can do; the page must still work */ }
}
function annotation(key) { return local[key] || {}; }

/* --------------------------------------------------------------------------
   Formatting
   -------------------------------------------------------------------------- */
function ago(iso) {
  if (!iso) return "";
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 0) return "just now";
  const mins = Math.floor(ms / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs / 24);
  if (days === 1) return "yesterday";
  if (days < 30) return days + "d ago";
  return Math.floor(days / 30) + "mo ago";
}

function clockUK(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleTimeString("en-GB", {
    hour: "2-digit", minute: "2-digit", timeZone: "Europe/London",
  });
}

/* Recency is judged on `effective_date`: the employer's real publication date where
   the adapter vouches for it, otherwise the first run in which we saw the role. The
   distinction is why these buckets no longer all return the same number. */
function isRecent(job, hours) {
  const raw = job.effective_date || job.first_seen;
  if (!raw) return false;
  return Date.now() - new Date(raw).getTime() < hours * HOUR;
}
function isHot(job) { return isRecent(job, HOT_HOURS); }

/* Why is this row here? The question anyone sensible asks first, and the page could
   not previously answer it. Composed from the fields the collector already tags, so
   it needs no new data: which seniority tier fired, which geography gate passed, and
   whether the date came from the employer or from when we first saw it. A filter you
   cannot interrogate is a filter you cannot trust. */
const TIER_WHY = {
  exec: "Exec title",
  director: "Director title",
  mid: "Mid-senior title",
};
const GEO_WHY = {
  "uk": "UK location",
  "remote-in-tz": "Remote, within GMT\u00b13",
  "remote-unspecified": "Remote, region unstated",
  "unstated": "Location unstated",
};
function matchReason(job) {
  const bits = [];
  bits.push(TIER_WHY[job.tier] || "Outside the title rules");
  bits.push(GEO_WHY[job.geo] || "Location accepted");
  bits.push(job.date_basis === "posted"
    ? "Employer publication date"
    : "Dated from first sight");
  if (job.missing_runs) bits.push("Absent from the last run");
  return bits.map(b => `<span>${esc(b)}</span>`).join('<span class="sep">&middot;</span>');
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/* Escaping and scheme validation are different controls, and esc() only does the first.
   It stops a value breaking out of an attribute, but href="javascript:..." needs no
   quotes or angle brackets to be dangerous — one click would run script on this origin.
   Every job URL here comes from a third party's API, so it is untrusted input by
   definition. Allow http and https, send anything else nowhere. */
function safeUrl(u) {
  try {
    const parsed = new URL(String(u), location.href);
    return (parsed.protocol === "https:" || parsed.protocol === "http:")
      ? parsed.href : "about:blank";
  } catch {
    return "about:blank";
  }
}

/* --------------------------------------------------------------------------
   Header: stats and the freshness strip
   -------------------------------------------------------------------------- */
/* "Collected 17m ago" tells you the job ran. It does not tell you whether anything
   happened, and most of the time nothing does — the interesting state is the quiet one,
   because a run that changes nothing is evidence the market is still rather than
   evidence the collector is broken. State it either way. */
function changeSummary() {
  const n = feed.new_this_run || 0;
  const c = feed.closed_this_run || 0;
  if (!n && !c) return "no change last run";
  const bits = [];
  if (n) bits.push(`<strong style="color:var(--teal)">${n}</strong> new`);
  if (c) bits.push(`<strong style="color:var(--muted)">${c}</strong> closed`);
  return bits.join(" &middot; ") + " last run";
}

function renderStats() {
  const matched = feed.jobs.filter(j => j.priority).length;
  const employers = new Set(feed.jobs.map(j => j.company)).size;
  const hotCount = feed.jobs.filter(isHot).length;
  // Order is the argument. "4 matched" alone reads as a broken product; the same
  // number at the end of 3,918 -> 375 -> 4 reads as precision. Lead with the work
  // done, not the residue.
  const tiles = [
    { n: feed.total_roles_seen, l: "Assessed", cls: "minor" },
    { n: feed.jobs.length,      l: "In scope", cls: "pool" },
    { n: matched,               l: "Matched",  cls: "prime" },
    { n: hotCount,              l: "Hot \u00b7 24h", hot: true },
    { n: feed.new_last_48h,     l: "New \u00b7 48h", accent: true },
    { n: feed.new_last_7d,      l: "New \u00b7 7d", minor: true },
    { n: feed.new_last_30d,     l: "New \u00b7 30d", minor: true },
    { n: employers,             l: "Hiring now", minor: true },
    { n: feed.employers_queried,  l: "Boards live", minor: true },
    { n: feed.employers_total || feed.employers_queried, l: "Tracked", minor: true },
  ];
  document.getElementById("stats").innerHTML = tiles.map(t => `
    <div class="stat${t.accent ? " accent" : ""}${t.hot ? " hotstat" : ""}${t.minor ? " minor" : ""}${t.cls ? " " + t.cls : ""}">
      <div class="n">${t.n == null ? "—" : t.n}</div>
      <div class="l">${t.l}</div>
    </div>`).join("");
}

/* The countdown is advisory, never a promise. GitHub queues scheduled workflows
   and runs them late under load — frequently 5 to 15 minutes, sometimes far more.
   So this shows "due", and when the window passes it says so plainly rather than
   counting into negative numbers and looking broken. */
const METER_BLOCKS = 24;   // one block per 5 minutes of a 2-hour cycle

/** Countdown, live to the second.
 *
 *  Presented as "due", never as a promise: GitHub queues scheduled workflows and
 *  runs them late under load, often by 5 to 15 minutes. Once the window passes the
 *  display says so plainly rather than counting into negatives. */
function renderFreshness() {
  const el = document.getElementById("freshness");
  const meter = document.getElementById("meter");

  const collected = new Date(feed.generated_at).getTime();
  const interval = (feed.run_interval_hours || 2) * HOUR;
  const due = collected + interval;
  const now = Date.now();
  const age = now - collected;

  const pad = n => String(n).padStart(2, "0");
  let cls = "", note = "", overdue = false;
  let frac = Math.min(1, age / interval);

  if (age > 4 * HOUR) {
    cls = "bad"; overdue = true; frac = 1;
    note = `<span class="clock overdue">${Math.floor(age / HOUR)}h stale</span>
            <span class="sep">&middot;</span> the last collection may have failed`;
  } else if (now >= due) {
    cls = "warn"; overdue = true; frac = 1;
    const late = now - due;
    note = `<span class="clock overdue">+${pad(Math.floor(late / 60000))}:${pad(Math.floor(late / 1000) % 60)}</span>
            <span class="sep">&middot;</span> due now, GitHub queues run late`;
  } else {
    const left = due - now;
    const h = Math.floor(left / HOUR);
    const m = Math.floor((left % HOUR) / 60000);
    const sec = Math.floor((left % 60000) / 1000);
    note = `next collection in
            <span class="clock">${h > 0 ? h + ":" : ""}${pad(m)}:${pad(sec)}</span>
            <span class="sep">&middot;</span> due ${clockUK(new Date(due).toISOString())}`;
  }

  el.innerHTML = `
    <span class="pulse ${cls}"></span>
    <span>Collected <strong style="color:var(--cream)">${clockUK(feed.generated_at)}</strong>
      &middot; ${ago(feed.generated_at)}</span>
    <span class="sep">|</span>
    <span>${changeSummary()}</span>
    <span class="sep">|</span>
    <span>${note}</span>`;

  // Rebuild the blocks only when the lit count changes, not 60 times a minute.
  const lit = Math.round(frac * METER_BLOCKS);
  if (meter.dataset.lit !== String(lit) || meter.childElementCount !== METER_BLOCKS) {
    meter.dataset.lit = String(lit);
    meter.innerHTML = Array.from({ length: METER_BLOCKS }, (_, i) => {
      if (i < lit - 1) return '<i class="lit"></i>';
      if (i === lit - 1) return '<i class="lit edge"></i>';
      return "<i></i>";
    }).join("");
  }
  meter.classList.toggle("overdue", overdue);
}

function renderBanner() {
  const el = document.getElementById("banner");
  const bits = [];
  if (feed.employers_failed > 0) {
    bits.push(`<div class="banner">
      <strong>${feed.employers_failed} ${feed.employers_failed === 1 ? "employer" : "employers"} unavailable</strong> in the last run.
      Most are enterprise employers awaiting a Workday careers URL, which is expected.
    </div>`);
  }
  if (!feed.jobs.length) {
    bits.push(`<div class="banner bad">
      <strong>The feed is empty.</strong> That is more likely a broken collection than
      an empty market &mdash; check the Actions tab.
    </div>`);
  }
  el.innerHTML = bits.join("");
}

/* --------------------------------------------------------------------------
   Filter options, derived from the data rather than hardcoded
   -------------------------------------------------------------------------- */
function populateSelects() {
  const fill = (id, values) => {
    const sel = document.getElementById(id);
    const first = sel.firstElementChild.outerHTML;
    sel.innerHTML = first + values.sort((a, b) => a.localeCompare(b))
      .map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  };
  // Sector dropdown shows readable labels but filters on the underlying slug.
  const sectors = [...new Set(feed.jobs.map(j => j.sector).filter(Boolean))]
    .sort((a, b) => sectorLabel(a).localeCompare(sectorLabel(b)));
  const sel = document.getElementById("sector");
  sel.innerHTML = sel.firstElementChild.outerHTML + sectors
    .map(v => `<option value="${esc(v)}">${esc(sectorLabel(v))}</option>`).join("");
  fill("company", [...new Set(feed.jobs.map(j => j.company).filter(Boolean))]);
}

function visible() {
  const q = ui.q.trim().toLowerCase();
  return feed.jobs.filter(job => {
    const ann = annotation(job.key);
    if (!ui.showDismissed && ann.dismissed) return false;
    if (ui.starred && !ann.starred) return false;
    // An explicit tier choice overrides "Matched only". Asking for mid-senior means
    // you want mid-senior, and mid is by definition outside the matched set — so
    // honouring both would always return nothing.
    if (ui.tier) {
      if (job.tier !== ui.tier) return false;
    } else if (ui.priority && !job.priority) {
      return false;
    }
    if (ui.hot && !isHot(job)) return false;
    if (ui.recent && !isRecent(job, 48)) return false;
    if (ui.size && job.size !== ui.size) return false;
    if (ui.sector && job.sector !== ui.sector) return false;
    if (ui.company && job.company !== ui.company) return false;
    if (q && !(job.title + " " + job.company).toLowerCase().includes(q)) return false;
    return true;
  });
}

function sortJobs(jobs) {
  const by = {
    new: (a, b) => (b.effective_date || b.first_seen || "").localeCompare(a.effective_date || a.first_seen || ""),
    company: (a, b) => a.company.localeCompare(b.company) || a.title.localeCompare(b.title),
    title: (a, b) => a.title.localeCompare(b.title),
  }[ui.sort];
  return [...jobs].sort(by);
}

/* --------------------------------------------------------------------------
   Rendering results, segmented by employer size
   -------------------------------------------------------------------------- */
function roleCard(job) {
  const ann = annotation(job.key);
  const fresh = isRecent(job, 48);
  const hot = isHot(job);
  const cls = [
    "role",
    hot ? "is-hot" : (fresh ? "is-new" : ""),
    ann.starred ? "shortlisted" : "",
    ann.dismissed ? "dismissed" : "",
    job.priority ? "" : "secondary",
  ].filter(Boolean).join(" ");

  const chips = [
    hot ? '<span class="chip hot">\u{1F525} HOT</span>'
        : (fresh ? '<span class="chip new">NEW</span>' : ""),
    job.tier === "mid" ? '<span class="chip tier">mid-senior</span>' : "",
    job.tier ? "" : '<span class="chip">wider scope</span>',
    job.sector ? `<span class="chip">${esc(sectorLabel(job.sector))}</span>` : "",
    job.geo === "remote-unspecified" ? '<span class="chip">remote, region unstated</span>' : "",
    job.geo === "unstated" ? '<span class="chip">location unstated</span>' : "",
    job.missing_runs ? '<span class="chip">may have closed</span>' : "",
  ].filter(Boolean).join("");

  return `
  <article class="${cls}" data-key="${esc(job.key)}">
    <div class="title">${esc(job.title)}</div>
    <div class="meta">
      <span class="company">${esc(job.company)}</span>
      <span class="sep">&middot;</span><span>${esc(job.location || "Location not stated")}</span>
      <span class="sep">&middot;</span><span>${job.date_basis === "posted" ? "posted" : "seen"} ${ago(job.effective_date || job.first_seen)}</span>
      ${chips}
    </div>
    <div class="why">${matchReason(job)}
    </div>
    <div class="actions">
      <button class="btn star ${ann.starred ? "on" : ""}" data-act="star"
              title="Shortlist">${ann.starred ? "★" : "☆"}</button>
      <button class="btn" data-act="dismiss"
              title="Dismiss">${ann.dismissed ? "Undo" : "Hide"}</button>
      <a class="btn open" href="${esc(safeUrl(job.url))}" target="_blank" rel="noopener noreferrer">Open</a>
    </div>
  </article>`;
}

function render() {
  const shown = sortJobs(visible());
  const host = document.getElementById("results");

  // The explanatory clause is hidden on a phone: it is permanently on screen inside
  // the sticky bar, and two wrapped lines of guidance is not worth 25px of every
  // scroll. The action itself stays.
  document.getElementById("countNote").innerHTML =
    `<strong>${shown.length}</strong> of ${feed.jobs.length}<span class="note-long"> UK or remote roles</span>.` +
    (ui.tier ? ` <span class="note-long">Seniority filter overrides &ldquo;matched only&rdquo;.</span>` : "") +
    (ui.priority
      ? ` <button id="loosen">Include the wider scope</button><span class="note-long"> to see what the title filter rejected.</span>`
      : ` <button id="tighten">Matched roles only</button>.`);

  if (!shown.length) {
    host.className = "empty";
    host.innerHTML = `<strong>Nothing matches those filters.</strong>
      Try clearing the search, or turning off &ldquo;Matched only&rdquo; to see the wider scope.`;
    wireCountNote();
    return;
  }

  host.className = "";
  host.innerHTML = BUCKETS.map(([key, label, range]) => {
    const rows = shown.filter(j => {
      const size = j.size || "unknown";
      // Unrecognised sizes collect in "unknown" rather than falling through the
      // bucket loop and rendering nowhere.
      return key === "unknown" ? !BUCKET_KEYS.has(size) || size === "unknown" : size === key;
    });
    if (!rows.length) return "";
    const collapsed = localStorage.getItem("rolefeed.collapsed." + key) === "1";
    return `
    <section class="bucket ${collapsed ? "collapsed" : ""}" data-bucket="${key}">
      <button class="bucket-head">
        <span class="blocks" aria-hidden="true"></span>
        <span class="chev">&#9660;</span>
        <h2>${label}</h2>
        ${range ? `<span class="range">${range}</span>` : ""}
        <span class="n">${rows.length}</span>
      </button>
      <div class="roles">${rows.map(roleCard).join("")}</div>
    </section>`;
  }).join("");

  wireCountNote();
}

function wireCountNote() {
  const loosen = document.getElementById("loosen");
  if (loosen) loosen.onclick = () => { setToggle("priority", false); };
  const tighten = document.getElementById("tighten");
  if (tighten) tighten.onclick = () => { setToggle("priority", true); };
}

/* --------------------------------------------------------------------------
   Events
   -------------------------------------------------------------------------- */
function setToggle(name, value) {
  ui[name] = value;
  syncFilterBadge();
  const map = { priority: "t-priority", hot: "t-hot", recent: "t-recent",
                starred: "t-star", showDismissed: "t-dismissed" };
  document.getElementById(map[name]).classList.toggle("on", value);
  render();
}

/** Number of filters differing from the default view. Shown on the Filters button so
 *  a collapsed panel never hides the fact that results are being narrowed. */
function activeFilterCount() {
  let n = 0;
  if (ui.size) n++;
  if (ui.sector) n++;
  if (ui.company) n++;
  if (ui.hot) n++;
  if (ui.recent) n++;
  if (ui.starred) n++;
  if (ui.showDismissed) n++;
  if (!ui.priority) n++;           // the wider scope is itself a deviation
  if (ui.tier) n++;
  if (ui.sort !== "new") n++;
  return n;
}

function syncFilterBadge() {
  const badge = document.getElementById("filterCount");
  const n = activeFilterCount();
  badge.textContent = String(n);
  badge.hidden = n === 0;
}

function wire() {
  const controls = document.querySelector(".controls");
  const btn = document.getElementById("filtersBtn");
  btn.addEventListener("click", () => {
    const open = controls.classList.toggle("open");
    btn.setAttribute("aria-expanded", String(open));
  });

  // Typing in search on a phone should not leave the panel covering the results.
  document.getElementById("q").addEventListener("focus", () => {
    controls.classList.remove("open");
    btn.setAttribute("aria-expanded", "false");
  });

  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  document.getElementById("q").addEventListener("input", debounce(e => {
    ui.q = e.target.value; render();
  }, 140));

  [["size", "size"], ["sector", "sector"], ["company", "company"],
   ["tier", "tier"], ["sort", "sort"]]
    .forEach(([id, key]) => {
      document.getElementById(id).addEventListener("change", e => {
        ui[key] = e.target.value; syncFilterBadge(); render();
      });
    });

  [["t-priority", "priority"], ["t-hot", "hot"], ["t-recent", "recent"],
   ["t-star", "starred"], ["t-dismissed", "showDismissed"]]
    .forEach(([id, key]) => {
      document.getElementById(id).addEventListener("click", () => setToggle(key, !ui[key]));
    });

  // One listener for the whole results area rather than one per card.
  document.getElementById("results").addEventListener("click", e => {
    const head = e.target.closest(".bucket-head");
    if (head) {
      const section = head.closest(".bucket");
      section.classList.toggle("collapsed");
      try {
        localStorage.setItem("rolefeed.collapsed." + section.dataset.bucket,
          section.classList.contains("collapsed") ? "1" : "0");
      } catch (err) { /* ignore */ }
      return;
    }
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const key = btn.closest(".role").dataset.key;
    const ann = local[key] = local[key] || {};
    if (btn.dataset.act === "star") ann.starred = !ann.starred;
    if (btn.dataset.act === "dismiss") ann.dismissed = !ann.dismissed;
    save();
    render();
  });
}

/* --------------------------------------------------------------------------
   The goose's idle animations.

   Every 20 seconds she does one small thing. The interval is deliberately long: a
   mascot that moves constantly becomes something you have to look past, whereas one
   that moves rarely is a small reward for happening to glance at the right moment.
   Vohra's "fun toys" principle, at the smallest possible scale.

   Sequences are lists of [frame, milliseconds]. The waddle is CSS instead, because it
   is a position change rather than a frame change.
   -------------------------------------------------------------------------- */
const GOOSE_IDLE_MS = 5000;

/* Weighted by how much attention each act draws. At a 7-second cycle the quiet ones
   have to dominate, or the header becomes a fidget. Blinks are listed several times so
   the random pick favours them; the big moves appear once each. */
const GOOSE_ACTS = [
  [["blink", 140]],
  [["blink", 140]],
  [["blink", 140]],
  [["blink", 130], ["idle", 110], ["blink", 130]],
  [["blink", 130], ["idle", 110], ["blink", 130]],
  // A look at the ground and back.
  [["peck", 320], ["idle", 150], ["peck", 280]],
  [["peck", 850]],
  // Head back, beak up — checking the sky for something.
  [["lookup", 700], ["idle", 120], ["blink", 130]],
  [["lookup", 420], ["idle", 140], ["lookup", 380]],
  // One wing out and back.
  [["flap", 220], ["idle", 110], ["flap", 220], ["idle", 100], ["flap", 200]],
  // Foot stamp, twice.
  [["stamp", 190], ["idle", 130], ["stamp", 190]],
  [["stamp", 160], ["idle", 110], ["stamp", 160], ["idle", 110], ["stamp", 160]],
  "waddle",
  "waddle-peck",
  // Shuffle: waddle, then a stamp to settle.
  "waddle-stamp",
];

let gooseBusy = false;

function playGooseAct(act) {
  const el = document.getElementById("goose");
  if (!el || gooseBusy) return;
  gooseBusy = true;

  const done = () => { el.dataset.frame = "idle"; el.classList.remove("waddle"); gooseBusy = false; };

  if (typeof act === "string") {
    el.classList.add("waddle");
    const tail = { "waddle-peck": "peck", "waddle-stamp": "stamp" }[act];
    setTimeout(() => {
      el.classList.remove("waddle");
      if (tail) {
        el.dataset.frame = tail;
        setTimeout(done, 340);
      } else { done(); }
    }, 760);
    return;
  }

  // Walk the [frame, ms] pairs in sequence.
  let i = 0;
  const step = () => {
    if (i >= act.length) { done(); return; }
    const [frame, ms] = act[i++];
    el.dataset.frame = frame;
    setTimeout(step, ms);
  };
  step();
}

function startGoose() {
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) return;
  setInterval(() => {
    // No point animating a tab nobody is looking at, and on a phone it is battery
    // spent for nothing.
    if (document.hidden) return;
    playGooseAct(GOOSE_ACTS[Math.floor(Math.random() * GOOSE_ACTS.length)]);
  }, GOOSE_IDLE_MS);

  // She blinks once shortly after load, so the first visit shows she is alive.
  setTimeout(() => { if (!document.hidden) playGooseAct(GOOSE_ACTS[0]); }, 2600);
}

/* --------------------------------------------------------------------------
   Boot
   -------------------------------------------------------------------------- */
async function boot() {
  try {
    // Cache-bust, so a redeploy is picked up rather than served from cache.
    const res = await fetch("data/jobs.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    feed = await res.json();
  } catch (err) {
    document.getElementById("results").className = "empty";
    document.getElementById("results").innerHTML =
      `<strong>Could not load the feed.</strong>
       <code>data/jobs.json</code> did not load (${esc(err.message)}).
       If you are opening this file directly, serve it instead:
       <code>cd site &amp;&amp; python -m http.server 8000</code>`;
    document.getElementById("freshness").innerHTML =
      '<span class="pulse bad"></span><span>Feed unavailable</span>';
    return;
  }

  const verLink = document.getElementById("verLink");
  if (verLink) verLink.textContent = "v" + RF_VERSION;

  renderStats();
  renderFreshness();
  renderBanner();
  populateSelects();
  wire();
  syncFilterBadge();
  render();
  startGoose();

  document.getElementById("footNote").innerHTML =
    `${feed.employers_queried} employers queried &middot;
     ${feed.total_roles_seen} roles seen &middot;
     ${feed.jobs.length} in scope &middot;
     ${feed.dated_from_source ?? 0} with a publisher date &middot;
     collected ${clockUK(feed.generated_at)} UK &middot; v${RF_VERSION} alpha.
     Shortlists are stored in this browser only.`;

  // Tick every second so the countdown is live. Cheap: it rewrites one line of text
  // and only rebuilds the meter blocks when the lit count actually changes.
  setInterval(renderFreshness, 1000);

  // iOS suspends timers when Safari is backgrounded, so the countdown would be wrong
  // on return. Recompute the moment the tab becomes visible again.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { renderFreshness(); render(); }
  });
}

boot();
</script>
