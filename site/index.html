Crect x='9' y='16' width='4' height='1' fill='%23d9d0bb'/%3E%3Crect x='13' y='16' width='7' height='1' fill='%23f4eddf'/%3E%3Crect x='20' y='16' width='1' height='1' fill='%232a2250'/%3E%3Crect x='2' y='17' width='1' height='1' fill='%232a2250'/%3E%3Crect x='3' y='17' width='1' height='1' fill='%23d9d0bb'/%3E%3Crect x='4' y='17' width='4' height='1' fill='%23f4eddf'/%3E%3Crect x='8' y='17' width='6' height='1' fill='%23d9d0bb'/%3E%3Crect x='14' y='17' width='6' height='1' fill='%23f4eddf'/%3E%3Crect x='20' y='17' width='1' height='1' fill='%232a2250'/%3E%3Crect x='2' y='18' width='1' height='1' fill='%232a2250'/%3E%3Crect x='3' y='18' width='2' height='1' fill='%23d9d0bb'/%3E%3Crect x='5' y='18' width='3' height='1' fill='%23f4eddf'/%3E%3Crect x='8' y='18' width='5' height='1' fill='%23d9d0bb'/%3E%3Crect x='13' y='18' width='6' height='1' fill='%23f4eddf'/%3E%3Crect x='19' y='18' width='1' height='1' fill='%232a2250'/%3E%3Crect x='3' y='19' width='1' height='1' fill='%232a2250'/%3E%3Crect x='4' y='19' width='2' height='1' fill='%23d9d0bb'/%3E%3Crect x='6' y='19' width='3' height='1' fill='%23f4eddf'/%3E%3Crect x='9' y='19' width='3' height='1' fill='%23d9d0bb'/%3E%3Crect x='12' y='19' width='6' height='1' fill='%23f4eddf'/%3E%3Crect x='18' y='19' width='1' height='1' fill='%232a2250'/%3E%3Crect x='4' y='20' width='2' height='1' fill='%231a1533'/%3E%3Crect x='6' y='20' width='2' height='1' fill='%23d9d0bb'/%3E%3Crect x='8' y='20' width='8' height='1' fill='%23f4eddf'/%3E%3Crect x='16' y='20' width='2' height='1' fill='%231a1533'/%3E%3Crect x='6' y='21' width='3' height='1' fill='%231a1533'/%3E%3Crect x='9' y='21' width='5' height='1' fill='%23f4eddf'/%3E%3Crect x='14' y='21' width='2' height='1' fill='%231a1533'/%3E%3Crect x='9' y='22' width='1' height='1' fill='%232a2250'/%3E%3Crect x='10' y='22' width='2' height='1' fill='%23f2a63a'/%3E%3Crect x='12' y='22' width='1' height='1' fill='%232a2250'/%3E%3Crect x='13' y='22' width='2' height='1' fill='%23f2a63a'/%3E%3Crect x='15' y='22' width='1' height='1' fill='%232a2250'/%3E%3Crect x='8' y='23' width='1' height='1' fill='%232a2250'/%3E%3Crect x='9' y='23' width='3' height='1' fill='%23f2a63a'/%3E%3Crect x='12' y='23' width='1' height='1' fill='%232a2250'/%3E%3Crect x='13' y='23' width='3' height='1' fill='%23f2a63a'/%3E%3Crect x='16' y='23' width='1' height='1' fill='%232a2250'/%3E%3Crect x='7' y='24' width='1' height='1' fill='%232a2250'/%3E%3Crect x='8' y='24' width='1' height='1' fill='%23f2a63a'/%3E%3Crect x='9' y='24' width='2' height='1' fill='%23c17d15'/%3E%3Crect x='11' y='24' width='1' height='1' fill='%23f2a63a'/%3E%3Crect x='12' y='24' width='1' height='1' fill='%232a2250'/%3E%3Crect x='13' y='24' width='1' height='1' fill='%23f2a63a'/%3E%3Crect x='14' y='24' width='2' height='1' fill='%23c17d15'/%3E%3Crect x='16' y='24' width='1' height='1' fill='%23f2a63a'/%3E%3Crect x='17' y='24' width='1' height='1' fill='%232a2250'/%3E%3Crect x='8' y='25' width='4' height='1' fill='%232a2250'/%3E%3Crect x='13' y='25' width='4' height='1' fill='%232a2250'/%3E%3C/svg%3E">
<style>
  /* ---------------------------------------------------------------------
     Design tokens. Every colour in the page comes from here, so retheming
     means editing this block and nothing else.
     --------------------------------------------------------------------- */
  :root {
    /* Base. Indigo, unchanged — Superhuman's own base is #1b1938, so this is a
       well-trodden value for a dark canvas. */
    --bg:            #14102b;
    --surface:       #1a1733;   /* neutral-warm, not violet-tinted */
    --surface-2:     #221e3d;

    /* Separation is CREAM at low alpha, not purple. This single change is what stops
       the page reading as "a purple app": structure becomes neutral, so the accent
       has something to stand against. */
    --border:        rgba(244, 237, 223, 0.13);
    --border-bright: rgba(244, 237, 223, 0.26);
    --rule:          rgba(244, 237, 223, 0.09);

    /* Purple now does exactly one job: mark what you should act on or look at.
       Primary button, focus ring, matched chip. Nowhere else. */
    --purple:        #8b6cff;
    --purple-bright: #a98bff;

    --gold:          #e9c46a;   /* deco rules and the plinth */
    --cream:         #f4eddf;
    --cream-dim:     #cfc6b8;
    --muted:         #9d9483;   /* warm grey, was lavender — the other purple leak */

    --amber:         #ffb84d;
    --hot:           #ff6a3d;   /* posted in the last 24h — hotter than amber */
    --amber-dim:     #6b4a17;
    --green:         #5ad1a0;
    --red:           #ff7a7a;

    /* Pixel art means no rounding. Everything is square. */
    --radius:   0px;
    --radius-s: 0px;
    --gutter: 16px;
    --max:   1180px;
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;   /* stop Safari inflating text on rotate */
    background: var(--bg);            /* colours the overscroll rubber-band area */
  }

  body {
    margin: 0;
    background: var(--bg);
    /* iOS momentum scrolling, and no grey flash on tap. */
    -webkit-overflow-scrolling: touch;
    -webkit-tap-highlight-color: transparent;
    /* Keeps content out from under the notch and the home indicator. */
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    color: var(--cream);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "cv02", "cv03", "cv04", "tnum";
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

  a { color: var(--purple-bright); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------------------------------------------------------------------
     Header
     --------------------------------------------------------------------- */
  header {
    border-bottom: 2px solid var(--rule);
    background: var(--bg);
    border-top: 3px solid var(--gold);
    padding: 22px 0 0;
  }

  /* --px is the size of one art pixel, shared by both marks so their grids align. */
  .masthead {
    --px: 2.6;
    display: flex;
    align-items: flex-end;      /* baselines, not centres: the goose stands on the rule */
    gap: calc(var(--px) * 5px);
    flex-wrap: wrap;
  }

  /* image-rendering: pixelated stops the browser smoothing the blocks, which is the
     whole point of drawing them as blocks. */
  .goose svg, .wordmark svg { image-rendering: pixelated; display: block; }
  .goose svg    { width: calc(var(--px) * 30px); height: calc(var(--px) * 27px); }
  .wordmark     { margin: 0; line-height: 0; }
  .wordmark svg { width: calc(var(--px) * 86px); height: calc(var(--px) * 26px); }

  .tagline {
    color: var(--muted);
    font-size: 10.5px;
    line-height: 1.5;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    border-left: 2px solid var(--rule);
    padding-left: 14px;
    margin-bottom: 4px;
  }

  /* Stat row */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
    gap: 10px;
    margin: 18px 0 0;
  }
  .stat {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 13px;
  }
  .stat .n {
    font-size: 25px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .stat .l {
    white-space: nowrap;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin-top: 3px;
  }
  .stat.accent { border-color: var(--amber-dim); }
  .stat.accent .n { color: var(--amber); }
  .stat.hotstat { border-color: var(--hot); }
  .stat.hotstat .n { color: var(--hot); }

  /* Freshness strip */
  .freshness { margin: 16px 0 0; padding-bottom: 18px; }
  .freshness-line {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--cream-dim);
  }
  .pulse {
    width: 8px; height: 8px;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(90, 209, 160, 0.16);
    flex: none;
  }
  .pulse.warn { background: var(--amber); box-shadow: 0 0 0 3px rgba(255,184,77,0.16); }
  .pulse.bad  { background: var(--red);   box-shadow: 0 0 0 3px rgba(255,122,122,0.16); }

  /* A segmented meter rather than a smooth bar: discrete blocks suit the pixel
     theme, and a block either is or is not lit, which reads faster than a bar edge. */
  .meter { display: flex; gap: 2px; margin-top: 10px; }
  .meter i {
    flex: 1;
    height: 7px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    transition: background 0.25s, border-color 0.25s;
  }
  .meter i.lit    { background: var(--gold);  border-color: var(--gold); }
  /* The leading block pulses, so the page reads as live rather than as a stale render. */
  .meter i.edge   { background: var(--cream); border-color: var(--cream); animation: blip 1s steps(2) infinite; }
  .meter.overdue i.lit  { background: var(--amber); border-color: var(--amber); }
  .meter.overdue i.edge { background: var(--amber); border-color: var(--amber); }
  @keyframes blip { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.35; } }

  .clock {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    color: var(--cream);
    font-weight: 620;
    letter-spacing: 0.02em;
  }
  .clock.overdue { color: var(--amber); }

  .sep { color: var(--border-bright); }

  /* ---------------------------------------------------------------------
     Controls
     --------------------------------------------------------------------- */
  .controls {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(20, 16, 43, 0.96);
    -webkit-backdrop-filter: blur(10px);   /* Safari still needs the prefix */
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
  }
  .control-row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }

  input[type="search"], select {
    background: var(--surface-2);
    color: var(--cream);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    padding: 9px 11px;
    font: inherit;
    font-size: 13px;
    /* Safari renders search inputs and selects with its own chrome unless told not to. */
    -webkit-appearance: none;
    appearance: none;
    min-height: 38px;
  }
  input[type="search"] { flex: 1 1 220px; min-width: 0; }
  input[type="search"]::placeholder { color: var(--muted); }
  /* Removes Safari's native magnifier and clear button, which ignore our styling. */
  input[type="search"]::-webkit-search-decoration,
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

  /* Mobile Safari zooms the entire page when a focused field's text is under 16px,
     leaving the user pinching back out. Raising the font on touch devices is the fix;
     it is applied by pointer type rather than width so a small laptop keeps 13px. */
  @media (pointer: coarse) {
    input[type="search"], select { font-size: 16px; min-height: 44px; }
  }
  input[type="search"]:focus, select:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(139, 108, 255, 0.16);
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 6px 13px;
    font-size: 13px;
    color: var(--cream-dim);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    white-space: nowrap;
    touch-action: manipulation;
    min-height: 34px;
  }
  .toggle:hover { border-color: var(--border-bright); }
  .toggle.on {
    background: rgba(244, 237, 223, 0.10);
    border-color: var(--border-bright);
    color: var(--cream);
  }
  .toggle.on.amber {
    background: rgba(255, 184, 77, 0.13);
    border-color: var(--amber);
  }
  .toggle input { display: none; }
  .toggle .tick { width: 13px; text-align: center; opacity: 0.45; }
  .toggle.on .tick { opacity: 1; color: var(--gold); }
  .toggle.on.amber .tick { color: var(--amber); }

  .toggle .flame { font-size: 12px; filter: grayscale(1) opacity(0.5); }
  .toggle.hot.on {
    background: rgba(255, 106, 61, 0.16);
    border-color: var(--hot);
    color: var(--cream);
  }
  .toggle.hot.on .flame { filter: none; }

  .chip.hot {
    background: rgba(255, 106, 61, 0.18);
    border-color: var(--hot);
    color: var(--hot);
    font-weight: 650;
  }
  .role.is-hot { border-left-color: var(--hot); }

  .count-note { font-size: 12px; color: var(--muted); margin-top: 9px; }
  .count-note button {
    background: none; border: none; padding: 0;
    color: var(--cream-dim); font: inherit; cursor: pointer;
    text-decoration: underline;
  }

  /* ---------------------------------------------------------------------
     Results
     --------------------------------------------------------------------- */
  main { padding: 22px 0 80px; }

  .bucket { margin-bottom: 26px; }
  .bucket-head {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    background: none; border: none; padding: 0 0 9px;
    color: var(--cream); font: inherit; cursor: pointer;
    border-bottom: 2px solid var(--rule);
    text-align: left;
  }
  .bucket-head h2 {
    margin: 0; font-size: 13px; font-weight: 620;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .bucket-head .range { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .bucket-head .n {
    margin-left: auto;
    background: var(--surface-2);
    border: 2px solid var(--border);
    border-radius: 0;
    padding: 1px 9px;
    font-size: 12px;
    color: var(--cream-dim);
    font-variant-numeric: tabular-nums;
  }
  .bucket-head .chev { color: var(--muted); font-size: 11px; transition: transform 0.15s; }
  .bucket.collapsed .chev { transform: rotate(-90deg); }
  .bucket.collapsed .roles { display: none; }

  .roles { display: grid; gap: 8px; padding-top: 12px; }

  .role {
    background: var(--surface);
    border: 2px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 14px;
    align-items: start;
    transition: border-color 0.12s, background 0.12s;
  }
  .role:hover { border-color: var(--border-bright); background: #201a47; }
  .role.is-new { border-left-color: var(--amber); }
  .role.priority-mark { border-left-color: var(--purple); }
  .role.shortlisted { border-left-color: var(--green); }
  .role.dismissed { opacity: 0.42; }
  .role.secondary .title { color: var(--cream-dim); font-weight: 500; }

  .role .title {
    grid-column: 1;
    font-size: 15px;
    font-weight: 580;
    letter-spacing: -0.005em;
  }
  .role .meta {
    grid-column: 1;
    font-size: 12.5px;
    color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .role .company { color: var(--cream-dim); font-weight: 500; }

  .chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
    border-radius: 0;
    padding: 0 7px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .chip.new { background: rgba(255,184,77,0.14); border-color: var(--amber-dim); color: var(--amber); font-weight: 600; }
  .chip.match { background: rgba(139,108,255,0.14); border-color: var(--purple); color: var(--purple-bright); }

  .role .actions {
    grid-column: 2; grid-row: 1 / span 2;
    display: flex; gap: 5px; align-items: center;
  }
  .btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--cream-dim);
    border-radius: var(--radius-s);
    padding: 5px 10px;
    font: inherit; font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-bright); color: var(--cream); }
  .btn.star.on { background: rgba(90,209,160,0.14); border-color: var(--green); color: var(--green); }
  /* Cream, not purple. Eight purple buttons down a page is not "a single gesture of
     colour" — it is the same mistake relocated. Superhuman uses warm cream for
     buttons for exactly this reason: the primary action reads as primary because it
     is the lightest thing on a dark canvas, and the accent stays rare. */
  .btn.open {
    background: var(--cream);
    border-color: var(--cream);
    color: #1a1533;
    font-weight: 650;
  }
  .btn.open:hover {
    background: #fffdf7; border-color: #fffdf7; text-decoration: none;
  }

  .empty, .loading {
    text-align: center;
    padding: 56px 20px;
    color: var(--muted);
  }
  .empty strong { color: var(--cream); display: block; margin-bottom: 6px; font-size: 16px; }

  .banner {
    border-radius: var(--radius);
    padding: 11px 14px;
    margin-bottom: 18px;
    font-size: 13px;
    border: 1px solid var(--amber-dim);
    background: rgba(255,184,77,0.08);
    color: var(--cream-dim);
  }
  .banner.bad { border-color: #6b2323; background: rgba(255,122,122,0.08); }
  .banner strong { color: var(--amber); }
  .banner.bad strong { color: var(--red); }

  footer {
    border-top: 1px solid var(--border);
    padding: 16px 0 40px;
    color: var(--muted);
    font-size: 12px;
  }

  @media (max-width: 640px) {
    .freshness-line .sep { display: none; }
    .masthead { --px: 2; gap: 10px; }
    .tagline { flex-basis: 100%; border-left: 0; padding-left: 0; margin-top: 4px; }
    /* Bigger tap targets and a roomier grid on a phone. */
    .btn { min-height: 40px; padding: 9px 13px; }
    .toggle { min-height: 40px; }
    .role { padding: 13px; }
    main { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    footer { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
    .controls { padding: 10px 0; }
    /* Four tiles, not eight. The other four are reference figures, and on a phone
       they push the actual roles three screens down. They stay in the footer line. */
    .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat.minor { display: none; }
    .stat { padding: 9px 11px; }
    .stat .n { font-size: 22px; }
    .role { grid-template-columns: 1fr; }
    .role .actions { grid-column: 1; grid-row: auto; padding-top: 6px; }
    .stat .n { font-size: 21px; }
    h1 { font-size: 19px; }
  }
</style>
</head>

      </select>
      <label class="toggle on" id="t-priority"><span class="tick">&#10003;</span>Matched only</label>
      <label class="toggle hot" id="t-hot"><span class="flame">&#128293;</span>Hot &mdash; 24h</label>
      <label class="toggle amber" id="t-recent"><span class="tick">&#10003;</span>New in 48h</label>
      <label class="toggle" id="t-star"><span class="tick">&#10003;</span>Shortlisted</label>
      <label class="toggle" id="t-dismissed"><span class="tick">&#10003;</span>Show dismissed</label>
    </div>
    <div class="count-note" id="countNote"></div>
  </div>
</div>

<main class="wrap">
  <div id="banner"></div>
  <div class="loading" id="results">Loading the feed&hellip;</div>
</main>

<footer class="wrap">
  <span id="footNote"></span>
</footer>

<script>
"use strict";

/* ---------------------------------------------------------------------------
   State. `feed` is the published JSON; `local` is per-viewer annotation.

   Shortlist and dismiss live in localStorage for now. That means one browser on
   one machine: it will not follow you to your phone, and clearing site data
   loses it. Moving this to Cloudflare KV via a Pages Function is the planned
   next step, and only this object needs to change when it happens.
   --------------------------------------------------------------------------- */
const LS_KEY = "rolefeed.annotations.v1";
const HOUR = 3600 * 1000;

let feed = null;
const local = load();

const ui = {
  q: "", size: "", sector: "", company: "", sort: "new",
  priority: true, hot: false, recent: false, starred: false, showDismissed: false,
};

// Hot means first seen in the last 24 hours. The window matters: the application-
// timing thesis is that the first 48 hours carry most of the odds, so 24 marks the
// half of that window still fully open.
const HOT_HOURS = 24;

/* Sector slugs are how the employer list stores them; these are how they should read. */
const SECTOR_LABELS = {
  ridehail: "Ride-hail", micromobility: "Micromobility", lastmile: "Last mile",
  freight: "Freight", fulfilment: "Fulfilment", charging: "EV charging",
  fleet: "Fleet & telematics", publictransport: "Public transport",
  aviation: "Aviation & space", autonomy: "Autonomy",
};
const sectorLabel = s => SECTOR_LABELS[s] || s || "";

const BUCKETS = [
  ["enterprise", "Enterprise", "5,000+"],
  ["large",      "Large",      "1,000–5,000"],
  ["mid",        "Mid",        "250–1,000"],
  ["scaleup",    "Scaleup",    "50–250"],
  ["unknown",    "Unclassified", ""],
];

function load() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
  catch (e) { return {}; }   // private mode, blocked storage, corrupt value
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(local)); }
  catch (e) { /* nothing we can do; the page must still work */ }
}
function annotation(key) { return local[key] || {}; }

/* --------------------------------------------------------------------------
   Formatting
   -------------------------------------------------------------------------- */
function ago(iso) {
  if (!iso) return "";
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 0) return "just now";
  const mins = Math.floor(ms / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs / 24);
  if (days === 1) return "yesterday";
  if (days < 30) return days + "d ago";
  return Math.floor(days / 30) + "mo ago";
}

function clockUK(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleTimeString("en-GB", {
    hour: "2-digit", minute: "2-digit", timeZone: "Europe/London",
  });
}

function isRecent(job, hours) {
  if (!job.first_seen) return false;
  return Date.now() - new Date(job.first_seen).getTime() < hours * HOUR;
}
function isHot(job) { return isRecent(job, HOT_HOURS); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/* --------------------------------------------------------------------------
   Header: stats and the freshness strip
   -------------------------------------------------------------------------- */
function renderStats() {
  const matched = feed.jobs.filter(j => j.priority).length;
  const employers = new Set(feed.jobs.map(j => j.company)).size;
  const hotCount = feed.jobs.filter(isHot).length;
  const tiles = [
    { n: matched,               l: "Matched" },
    { n: hotCount,              l: "Hot \u00b7 24h", hot: true },
    { n: feed.new_last_48h,     l: "New \u00b7 48h", accent: true },
    { n: feed.new_last_7d,      l: "New \u00b7 7d", minor: true },
    { n: feed.jobs.length,      l: "In scope" },
    { n: employers,             l: "Hiring now", minor: true },
    { n: feed.employers_queried,  l: "Boards live", minor: true },
    { n: feed.employers_total || feed.employers_queried, l: "Tracked", minor: true },
  ];
  document.getElementById("stats").innerHTML = tiles.map(t => `
    <div class="stat${t.accent ? " accent" : ""}${t.hot ? " hotstat" : ""}${t.minor ? " minor" : ""}">
      <div class="n">${t.n == null ? "—" : t.n}</div>
      <div class="l">${t.l}</div>
    </div>`).join("");
}

/* The countdown is advisory, never a promise. GitHub queues scheduled workflows
   and runs them late under load — frequently 5 to 15 minutes, sometimes far more.
   So this shows "due", and when the window passes it says so plainly rather than
   counting into negative numbers and looking broken. */
const METER_BLOCKS = 24;   // one block per 5 minutes of a 2-hour cycle

/** Countdown, live to the second.
 *
 *  Presented as "due", never as a promise: GitHub queues scheduled workflows and
 *  runs them late under load, often by 5 to 15 minutes. Once the window passes the
 *  display says so plainly rather than counting into negatives. */
function renderFreshness() {
  const el = document.getElementById("freshness");
  const meter = document.getElementById("meter");

  const collected = new Date(feed.generated_at).getTime();
  const interval = (feed.run_interval_hours || 2) * HOUR;
  const due = collected + interval;
  const now = Date.now();
  const age = now - collected;

  const pad = n => String(n).padStart(2, "0");
  let cls = "", note = "", overdue = false;
  let frac = Math.min(1, age / interval);

  if (age > 4 * HOUR) {
    cls = "bad"; overdue = true; frac = 1;
    note = `<span class="clock overdue">${Math.floor(age / HOUR)}h stale</span>
            <span class="sep">&middot;</span> the last collection may have failed`;
  } else if (now >= due) {
    cls = "warn"; overdue = true; frac = 1;
    const late = now - due;
    note = `<span class="clock overdue">+${pad(Math.floor(late / 60000))}:${pad(Math.floor(late / 1000) % 60)}</span>
            <span class="sep">&middot;</span> due now, GitHub queues run late`;
  } else {
    const left = due - now;
    const h = Math.floor(left / HOUR);
    const m = Math.floor((left % HOUR) / 60000);
    const sec = Math.floor((left % 60000) / 1000);
    note = `next collection in
            <span class="clock">${h > 0 ? h + ":" : ""}${pad(m)}:${pad(sec)}</span>
            <span class="sep">&middot;</span> due ${clockUK(new Date(due).toISOString())}`;
  }

  el.innerHTML = `
    <span class="pulse ${cls}"></span>
    <span>Collected <strong style="color:var(--cream)">${clockUK(feed.generated_at)}</strong>
      &middot; ${ago(feed.generated_at)}</span>
    <span class="sep">|</span>
    <span>${note}</span>`;

  // Rebuild the blocks only when the lit count changes, not 60 times a minute.
  const lit = Math.round(frac * METER_BLOCKS);
  if (meter.dataset.lit !== String(lit) || meter.childElementCount !== METER_BLOCKS) {
    meter.dataset.lit = String(lit);
    meter.innerHTML = Array.from({ length: METER_BLOCKS }, (_, i) => {
      if (i < lit - 1) return '<i class="lit"></i>';
      if (i === lit - 1) return '<i class="lit edge"></i>';
      return "<i></i>";
    }).join("");
  }
  meter.classList.toggle("overdue", overdue);
}

function renderBanner() {
  const el = document.getElementById("banner");
  const bits = [];
  if (feed.employers_failed > 0) {
    bits.push(`<div class="banner">
      <strong>${feed.employers_failed} employers unavailable</strong> in the last run.
      Most are enterprise employers awaiting a Workday careers URL, which is expected.
    </div>`);
  }
  if (!feed.jobs.length) {
    bits.push(`<div class="banner bad">
      <strong>The feed is empty.</strong> That is more likely a broken collection than
      an empty market &mdash; check the Actions tab.
    </div>`);
  }
  el.innerHTML = bits.join("");
}

/* --------------------------------------------------------------------------
   Filter options, derived from the data rather than hardcoded
   -------------------------------------------------------------------------- */
function populateSelects() {
  const fill = (id, values) => {
    const sel = document.getElementById(id);
    const first = sel.firstElementChild.outerHTML;
    sel.innerHTML = first + values.sort((a, b) => a.localeCompare(b))
      .map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  };
  // Sector dropdown shows readable labels but filters on the underlying slug.
  const sectors = [...new Set(feed.jobs.map(j => j.sector).filter(Boolean))]
    .sort((a, b) => sectorLabel(a).localeCompare(sectorLabel(b)));
  const sel = document.getElementById("sector");
  sel.innerHTML = sel.firstElementChild.outerHTML + sectors
    .map(v => `<option value="${esc(v)}">${esc(sectorLabel(v))}</option>`).join("");
  fill("company", [...new Set(feed.jobs.map(j => j.company).filter(Boolean))]);
}

function visible() {
  const q = ui.q.trim().toLowerCase();
  return feed.jobs.filter(job => {
    const ann = annotation(job.key);
    if (!ui.showDismissed && ann.dismissed) return false;
    if (ui.starred && !ann.starred) return false;
    if (ui.priority && !job.priority) return false;
    if (ui.hot && !isHot(job)) return false;
    if (ui.recent && !isRecent(job, 48)) return false;
    if (ui.size && job.size !== ui.size) return false;
    if (ui.sector && job.sector !== ui.sector) return false;
    if (ui.company && job.company !== ui.company) return false;
    if (q && !(job.title + " " + job.company).toLowerCase().includes(q)) return false;
    return true;
  });
}

function sortJobs(jobs) {
  const by = {
    new: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || ""),
    company: (a, b) => a.company.localeCompare(b.company) || a.title.localeCompare(b.title),
    title: (a, b) => a.title.localeCompare(b.title),
  }[ui.sort];
  return [...jobs].sort(by);
}

/* --------------------------------------------------------------------------
   Rendering results, segmented by employer size
   -------------------------------------------------------------------------- */
function roleCard(job) {
  const ann = annotation(job.key);
  const fresh = isRecent(job, 48);
  const hot = isHot(job);
  const cls = [
    "role",
    hot ? "is-hot" : (fresh ? "is-new" : ""),
    ann.starred ? "shortlisted" : "",
    ann.dismissed ? "dismissed" : "",
    job.priority ? "" : "secondary",
  ].filter(Boolean).join(" ");

  const chips = [
    hot ? '<span class="chip hot">\u{1F525} HOT</span>'
        : (fresh ? '<span class="chip new">NEW</span>' : ""),
    job.priority ? "" : '<span class="chip">wider scope</span>',
    job.sector ? `<span class="chip">${esc(sectorLabel(job.sector))}</span>` : "",
    job.geo === "remote-unspecified" ? '<span class="chip">remote, region unstated</span>' : "",
    job.geo === "unstated" ? '<span class="chip">location unstated</span>' : "",
    job.missing_runs ? '<span class="chip">may have closed</span>' : "",
  ].filter(Boolean).join("");

  return `
  <article class="${cls}" data-key="${esc(job.key)}">
    <div class="title">${esc(job.title)}</div>
    <div class="meta">
      <span class="company">${esc(job.company)}</span>
      <span class="sep">&middot;</span><span>${esc(job.location || "Location not stated")}</span>
      <span class="sep">&middot;</span><span>seen ${ago(job.first_seen)}</span>
      ${chips}
    </div>
    <div class="actions">
      <button class="btn star ${ann.starred ? "on" : ""}" data-act="star"
              title="Shortlist">${ann.starred ? "★" : "☆"}</button>
      <button class="btn" data-act="dismiss"
              title="Dismiss">${ann.dismissed ? "Undo" : "Hide"}</button>
      <a class="btn open" href="${esc(job.url)}" target="_blank" rel="noopener">Open</a>
    </div>
  </article>`;
}

function render() {
  const shown = sortJobs(visible());
  const host = document.getElementById("results");

  document.getElementById("countNote").innerHTML =
    `Showing <strong>${shown.length}</strong> of ${feed.jobs.length} UK or remote roles.` +
    (ui.priority
      ? ` <button id="loosen">Include the wider scope</button> to see what the title filter rejected.`
      : ` <button id="tighten">Matched roles only</button>.`);

  if (!shown.length) {
    host.className = "empty";
    host.innerHTML = `<strong>Nothing matches those filters.</strong>
      Try clearing the search, or turning off &ldquo;Matched only&rdquo; to see the wider scope.`;
    wireCountNote();
    return;
  }

  host.className = "";
  host.innerHTML = BUCKETS.map(([key, label, range]) => {
    const rows = shown.filter(j => (j.size || "unknown") === key);
    if (!rows.length) return "";
    const collapsed = localStorage.getItem("rolefeed.collapsed." + key) === "1";
    return `
    <section class="bucket ${collapsed ? "collapsed" : ""}" data-bucket="${key}">
      <button class="bucket-head">
        <span class="chev">&#9660;</span>
        <h2>${label}</h2>
        ${range ? `<span class="range">${range}</span>` : ""}
        <span class="n">${rows.length}</span>
      </button>
      <div class="roles">${rows.map(roleCard).join("")}</div>
    </section>`;
  }).join("");

  wireCountNote();
}

function wireCountNote() {
  const loosen = document.getElementById("loosen");
  if (loosen) loosen.onclick = () => { setToggle("priority", false); };
  const tighten = document.getElementById("tighten");
  if (tighten) tighten.onclick = () => { setToggle("priority", true); };
}

/* --------------------------------------------------------------------------
   Events
   -------------------------------------------------------------------------- */
function setToggle(name, value) {
  ui[name] = value;
  const map = { priority: "t-priority", hot: "t-hot", recent: "t-recent",
                starred: "t-star", showDismissed: "t-dismissed" };
  document.getElementById(map[name]).classList.toggle("on", value);
  render();
}

function wire() {
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  document.getElementById("q").addEventListener("input", debounce(e => {
    ui.q = e.target.value; render();
  }, 140));

  [["size", "size"], ["sector", "sector"], ["company", "company"], ["sort", "sort"]]
    .forEach(([id, key]) => {
      document.getElementById(id).addEventListener("change", e => {
        ui[key] = e.target.value; render();
      });
    });

  [["t-priority", "priority"], ["t-hot", "hot"], ["t-recent", "recent"],
   ["t-star", "starred"], ["t-dismissed", "showDismissed"]]
    .forEach(([id, key]) => {
      document.getElementById(id).addEventListener("click", () => setToggle(key, !ui[key]));
    });

  // One listener for the whole results area rather than one per card.
  document.getElementById("results").addEventListener("click", e => {
    const head = e.target.closest(".bucket-head");
    if (head) {
      const section = head.closest(".bucket");
      section.classList.toggle("collapsed");
      try {
        localStorage.setItem("rolefeed.collapsed." + section.dataset.bucket,
          section.classList.contains("collapsed") ? "1" : "0");
      } catch (err) { /* ignore */ }
      return;
    }
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const key = btn.closest(".role").dataset.key;
    const ann = local[key] = local[key] || {};
    if (btn.dataset.act === "star") ann.starred = !ann.starred;
    if (btn.dataset.act === "dismiss") ann.dismissed = !ann.dismissed;
    save();
    render();
  });
}

/* --------------------------------------------------------------------------
   Boot
   -------------------------------------------------------------------------- */
async function boot() {
  try {
    // Cache-bust, so a redeploy is picked up rather than served from cache.
    const res = await fetch("data/jobs.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    feed = await res.json();
  } catch (err) {
    document.getElementById("results").className = "empty";
    document.getElementById("results").innerHTML =
      `<strong>Could not load the feed.</strong>
       <code>data/jobs.json</code> did not load (${esc(err.message)}).
       If you are opening this file directly, serve it instead:
       <code>cd site &amp;&amp; python -m http.server 8000</code>`;
    document.getElementById("freshness").innerHTML =
      '<span class="pulse bad"></span><span>Feed unavailable</span>';
    return;
  }

  renderStats();
  renderFreshness();
  renderBanner();
  populateSelects();
  wire();
  render();

  document.getElementById("footNote").innerHTML =
    `${feed.employers_queried} employers queried &middot;
     ${feed.total_roles_seen} roles seen &middot;
     ${feed.jobs.length} in scope &middot;
     collected ${clockUK(feed.generated_at)} UK.
     Shortlists are stored in this browser only.`;

  // Tick every second so the countdown is live. Cheap: it rewrites one line of text
  // and only rebuilds the meter blocks when the lit count actually changes.
  setInterval(renderFreshness, 1000);

  // iOS suspends timers when Safari is backgrounded, so the countdown would be wrong
  // on return. Recompute the moment the tab becomes visible again.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { renderFreshness(); render(); }
  });
}

boot();
</script>
</body>
</html>
